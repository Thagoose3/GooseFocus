<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#bg-grad)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Goose Body -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="64" cy="76" rx="32" ry="24" fill="#ffffff"/>
    <ellipse cx="64" cy="78" rx="28" ry="20" fill="#f8fafc"/>
    <!-- Tail -->
    <path d="M 34 72 Q 22 64 26 78 Q 32 82 38 80 Z" fill="#ffffff"/>
    <!-- Wing -->
    <path d="M 50 72 C 50 64 68 62 76 74 C 80 80 72 88 56 86 C 50 85 50 78 50 72 Z" fill="#e2e8f0"/>
    <!-- Neck & Head -->
    <path d="M 80 74 Q 90 60 88 40 Q 86 28 96 28 Q 104 28 102 44 Q 98 66 84 80 Z" fill="#ffffff"/>
    <!-- Beak -->
    <path d="M 98 32 L 118 36 Q 112 42 98 40 Z" fill="url(#gold-grad)"/>
    <!-- Eye -->
    <circle cx="94" cy="34" r="3" fill="#0f172a"/>
    <circle cx="95" cy="33" r="1" fill="#ffffff"/>
    <!-- Crown on Head -->
    <path d="M 88 26 L 91 16 L 95 23 L 99 15 L 103 23 L 107 17 L 106 26 Z" fill="url(#gold-grad)"/>
    <circle cx="91" cy="16" r="1.5" fill="#ef4444"/>
    <circle cx="99" cy="15" r="1.5" fill="#3b82f6"/>
    <circle cx="107" cy="17" r="1.5" fill="#10b981"/>
  </g>
</svg>
